name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      TARGET: ${{ matrix.target }}
      COMMIT: ${{ github.sha }}
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Check release helper
        run: python3 -m unittest discover -s tests -p test_release.py
      - name: Format, lint and test
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --target "$TARGET" -- -D warnings
          cargo test --locked --target "$TARGET"
      - name: Build and test the extracted release archive
        run: |
          cargo build --release --locked --bins --target "$TARGET"
          archive="$(python3 scripts/release.py package --target "$TARGET" --tag "$RELEASE_TAG" --commit "$COMMIT")"
          python3 scripts/release.py check --target "$TARGET" --tag "$RELEASE_TAG" --commit "$COMMIT" --archive "$archive"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
